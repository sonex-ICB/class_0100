<body>
    <section>
        <div class="panel left-panel">
            <div class="title">
                <div class="icon"><span> <i class="ri-building-fill"></i> </span> </div>
                <h1> UPMONEY</h1>
                <p>MICRO FINANCE BANK</p>
            </div>
            <div class="desc">
                <p> Best Banking and loan services services </p>
                <ul>
                    <li> <i class="ri-shield-check-line"></i> Secured</li>
                    <li> <i class="ri-flashlight-line"></i> Fast</li>
                    <li> <i class="ri-check-double-fill"></i> reliable</li>
                </ul>
                <p><span class="badge"> <i class="ri-verified-badge-line "></i> Trusted by millions</span></p>
            </div>
        </div>
        <div class="panel end-panel">
            <div class="title">
                <div class="icon"><span> <i class="ri-building-fill"></i> </span> </div>
                <h1> UPMONEY</h1>
                <p>MICRO FINANCE BANK</p>
            </div>
            <form action="" novalidate>
                <h3> Get started </h3>
                <p> Please fill all required fields</p>
                <label for="first_name">First Name</label>
                <input id="first_name" data-name="First Name" type="text" placeholder="Mary" id="first_name" required>

                <label for="last_name">Last Name</label>
                <input id="last_name" data-name="Last Name" type="text" placeholder="Mat" id="last_name">

                <label for="email">Email</label>
                <input id="email" data-name="Email" type="email" placeholder="someone@mail.com" id="email">

                <label for="mobile_number">Mobile Number</label>
                <input id="mobile_number" data-name="Mobile Number" type="text" placeholder="+234" id="mobile_number">

                <label for="gender">Gender</label>
                <select name="" id="gender">
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="address">Address </label>
                <textarea name="" rows="5" id="address" id="address">No 4 First street </textarea>
                <div class=" d-none alert alert-warning my-4">
                    error! Somexsscsds
                </div>
                <button type="submit"> Submit </button>
                <div>
                    <input type="checkbox">
                    <span>Accept <a href="">Terms and conditions</a></span>
                </div>
                <div> <a href=""> Back to login</a> </div>
            </form>
        </div>

    </section>


</body>
<script>
    document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault()
        submit_form()
    })

    function submit_form() {
        let inputs = document.querySelectorAll('input, select, textarea')
        let USER = {};
        let is_complete = true;
        inputs.forEach(i => {
            if (i.value.trim() == '') {
                i.placeholder = i.dataset.name + " cannot be empty"
                is_complete  = false;
                i.classList.add('border-warning')
            } else {
                i.classList.remove('border-warning')
                USER[i.id] = i.value.trim();
            }
        })
        console.log(USER)
        if (is_complete) {
            // server request 
            response = [
                {
                    icon:"error",
                    title:"Error",
                    html:"An error occured! Try later",
                },
                {
                    icon:"success",
                    title:"Success",
                    html:`Account created succesfully`,
                }
            ]
            let sm = Math.round(Math.random());
            Swal.fire({
                icon:  response[sm].icon,
                title: response[sm].title,
                html:  response[sm].html 
            })
        }
    }



</script>
