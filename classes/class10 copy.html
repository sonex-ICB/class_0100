<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="container row mx-auto">
        <form action="" class="col-12 col-md-8 col-lg-5 shadow py-5 my-5 border-top  border-5 border-success rounded">
            <div class="fw-bold text-secondary py-3"> Welcome back</div>
            <input type="text" id="input1" class="form-control my-2">
            <input type="text" id="input2" class="form-control my-2">
            <div class="display"></div>
            <button type="button" onclick='my_func()' class="btn btn-success fw-bold container"> Submit</button>
        </form>
    </section>
</body>
<script>
    function my_func(){
        let text_elt = document.querySelector('.display')

        let input1 = document.querySelector('#input1')
        let input2 = document.querySelector('#input2')
        success_cls = `alert alert-success alert-dismissible`
        err_cls = `alert alert-warning alert-dismissible`

        if(input1.value == ''){
            input1.style.border='1px solid red'
            mss = `<div class='${err_cls}'> 
                    <button type='button' class='btn-close' data-bs-dismiss='alert' > </button>
                Input1 value cannot be empty
                </div>`
        }
        else if(input2.value == ''){
            input2.style.border='1px solid red'
            mss = `<div class='${err_cls}'> 
                    <button type='button' class='btn-close' data-bs-dismiss='alert' > </button>
                Input2 value cannot be empty
                </div>`

        }
        else{
            mss = `<div class='${success_cls}'> 
                    <button type='button' class='btn-close' data-bs-dismiss='alert' > </button>
                       Welcome ${input1.value}
                </div>`
            input1.style.border='1px solid #000'
            input2.style.border='1px solid #000'
        }
        text_elt.innerHTML = mss

    }
</script>
</html>
