<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="POST">
        <label for=""> Email or Username</label>
        <div class="form-group">
            <input type="text" required name="username" id="email" />
        </div>
        <b> <a href=""></a></b>
        <p>  Welcome to  </p>

        
        <label for=""> Password</label>
        <div  class="form-group">
            <input type="password" required name="password"  id="pass"/>
            <button type="button" onclick="view_pass(this)"> Show </button>
        </div>

        <p> <a href="forgot-password.html"> Forgot Password </a> </p>
        <div class="response"></div>
        <button type="button" onclick="submitFrom()"> Submit   </button>
        <div>
            <hr>
            <span> login wit</span>
            <hr>
        </div>
        <div>
            <a href="">google</a>
            <a href="">Facebook</a>
        </div>
        

        <p> Dont ave an account  <a href="signup.html"> Sign Up </a></p>
    </form>
</body>
<script>
    function submitFrom(){
        let response_elt = document.querySelector('.response')
        let email = document.querySelector('#email').value
        let pass = document.querySelector('#pass').value
        let status  = pass =='' || email == '' 
        if(status){
            response_elt.innerHTML =  "Imcomplete data "
            response_elt.style.color = "red"
        }else{
            const db = {
                username:'admin',
                passk:'1234'
            }
            verify = db.username == email && db.passk == pass
            response_elt.innerHTML = verify ? "Succesful": "Invlaid credentials"
            response_elt.style.color =  verify ? "blue" :"red"
            
        }
    }
    function view_pass(btn){
        let passelt =  document.querySelector('#pass');
        btn.innerHTML = passelt.type == 'text' ? 'Show' :'hide'
        passelt.type = passelt.type == 'text' ? 'password': 'text'
    }
</script>
</html>
