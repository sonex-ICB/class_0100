<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

    crossorigin="anonymous"></script>
</head>

<body>
  <header class="d-flex align-items-center justify-content-between p-2 shadow">
    <h3>E-market</h3>
    <div class="badge bg-dark" id="cart_display">0</div>
  </header>
  <div class="container mx-auto row " id="products_container">
    <!-- <div class="col-sm col-md-6 col-lg-4 my-3">
      <div class="card shadow overflow-hidden border">

  </div>

</body>
<script>
  let CART = [];
  let products = '';
  let products_container = document.querySelector('#products_container');
  function load_products() {
    fetch('.json')
      .then(p => p.json())
      .then(p => {
        products = p;
        products.forEach(p => {
          is_available = p.qty > 0
          if (is_available) {
            products_container.innerHTML += (`<div class="col-sm col-md-6 col-lg-4 my-3 ">
      <div class="card shadow overflow-hidden border">
        <img src="${p.pic}" width="100%" alt="">
        <div class="p-2">
          <div class="fw"> ${p.name} </div>
          <div class="d-flex justify-content-between">
            <div>
              <button class="btn btn-primary btn-sm" onclick='add_to_cart("${p.id}")'> Add Cart</button>
              <button class="btn btn-primary btn-sm" onclick='viewProduct("${p.id}")'> View </button>

            </div>
            <div class="fw-bold "> N${p.price}</div>
          </div>
        </div>
      </div>
    </div>`)
          }
        })
      })
      .catch(e =>{
        document.writeln(e)
      })
  }

  load_products()
  function add_to_cart(id) {
    if (!CART.includes(id)) {
      CART.push(id)
      document.querySelector('#cart_display').innerHTML = CART.length
    }
  }

  function viewProduct(id) {
    product = ''
    for (i = 0; i < products.length; i++) {
      if (products[i].id == id) {
        product = products[i]
        break
      }
    }
    /*
     "details": [
        { "Color": "Silver" },
        { "Display": "AMOLED" },
        { "Water Resistance": "5 ATM" }
      ],

    */
    desc = '';
    product.details.forEach(d => {
      for (x in d) {
        desc += `<li>${x} : ${d[x]}</li>`
      }
    })
    let UI = `
     <div class="container p-0">
    <div class="container">
        <div class="p-4">
          <img src="" width="50%" class="mx-auto" alt="">
            <p>${product.description}</p>
            <ul class="list-unstyled">
            ${desc}
            </ul>
        </div>
    </div>
  </div>
    `

    Swal.fire({
      title: product.name,
      html: UI,
    });
  }

  // viewProduct('P004')
</script>

</html>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
