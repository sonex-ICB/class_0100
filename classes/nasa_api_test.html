<script>
  const container = document.querySelector('#container1');
  function loadData() {
    const API_KEY = 'DEMO_KEY'
   const date = '2026-04-01'
    const url = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&date=${data}`
    fetch(url)
      .then(r => r.json())
      .then(r => {
        const data = r
        let template = `<div class="card shadow border">
          <div class="p-3">
            <div class="fw-bold"> ${data.title} </div>
            <div class="badge  bg-warning-subtle text-dark"> ${data.date}</div>
            <div class="small">${data.explanation}</div>
            <div class=""> <img src="${data.hdurl}" alt="" width='80%' class='d-block mx-auto'> </div>
          </div>
        </div>`
        document.querySelector('#display').innerHTML = template
      })
      .catch(e => {
        Swal.fire({
          'icon': "errro",
          title: "Error",
          text: "Sorry unable to load data"
        })
      })

  }
  loadData()

</script>
