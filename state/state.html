<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
<select name="" id="stateTableBody"></select>
</body>

<script>

    const nigeriaStatesAndCapitals = [
        {
            state: "Lagos",
            capital: "Ikeja",
            localAreas: [
                "Agege", "Ajeromi-Ifelodun", "Alimosho", "Amuwo-Odofin", "Apapa",
                "Badagry", "Epe", "Eti-Osa", "Ibeju-Lekki", "Ifako-Ijaiye",
                "Ikeja", "Ikorodu", "Kosofe", "Lagos Island", "Lagos Mainland",
                "Mushin", "Ojo", "Oshodi-Isolo", "Shomolu", "Surulere"
            ]
        },
        {
            state: "Abia",
            capital: "Umuahia",
            localAreas: [
                "Aba North", "Aba South", "Isiala Ngwa North", "Isiala Ngwa South",
                "Bende", "Ikwuano", "Ohafia", "Umuahia North", "Umuahia South", "Ukwa East", "Ukwa West"
            ]
        },
        {
            state: "Kaduna",
            capital: "Kaduna",
            localAreas: [
                "Birnin Gwari", "Chikun", "Giwa", "Igabi", "Ikara", "Jaba", "Jema'a",
                "Kachia", "Kaduna North", "Kaduna South", "Kagarko", "Kajuru", "Kaura",
                "Kauru", "Kubau", "Kudan", "Lere", "Makarfi", "Sabon Gari", "Sanga", "Soba", "Zangon Kataf", "Zaria"
            ]
        }
    ];


    ol = document.createElement('ol')
    seleect = document.querySelector('#stateTableBody');
    nigeriaStatesAndCapitals.forEach(p => {
        ol.innerHTML += `<li> ${p.state} </li>`
        seleect.innerHTML += `<option>${p.state}</option>`
    });


    document.querySelector('stateTableBody').appendChild(ol)
</script>

</body>

</html>

</html>
