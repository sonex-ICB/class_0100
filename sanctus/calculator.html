<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body class="bg-secondary">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 bg-dark">
                <div class="card shadow bg-warning">
                    <div class="card-header text-center">
                        <h3>Calculator</h3>
                    </div>

                    <div class="card-body">
                        <input type="text" id="display" class="form-control mb-3 text-end" >
                        <div class="row g-2">
                            <div class="col-3">
                                <button id="clear" class="btn btn-danger w-100">C</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-primary w-100 button">/</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-primary w-100 button">*</button>
                            </div>

                            <div class="col-3">
                                <button id="delete" class="btn btn-secondary d-flex w-100"><=</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">7</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">8</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">9</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-primary w-100 button">-</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">4</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">5</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">6</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-primary w-100 button">+</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">1</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">2</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 button">3</button>
                            </div>

                            <div class="col-3">
                                <button id="equal" class="btn btn-success w-100">=</button>
                            </div>

                            <div class="col-6">
                                <button class="btn btn-light w-100 button">0</button>
                            </div>

                            <div class="col-6">
                                <button class="btn btn-light w-100 button">.</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mt-4 mt-md-0">
                <div class="card shadow bg-black">
                    <div class="card-header d-flex justify-content-center bg-dark">
                        <h4 class="hist text-light">History</h4>
                    </div>

                    <div class="card-body">
                        <ul id="history" class="list-group-black text-light  mb-3 overflow-auto" style="height: 100px;"></ul>

                        <div class="clrhist d-flex justify-content-center">
                        <button id="clearHistory" class="btn btn-danger text-black w-2 rounded-3">
                            Clear History
                        </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");
        let buttons = document.getElementsByClassName("button");
        let history = document.getElementById("history");
        let clear = document.getElementById("clear");
        let deleteButton = document.getElementById("delete");
        let equal = document.getElementById("equal");
        let clearHistory = document.getElementById("clearHistory");

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener("click", function () {
                display.value += buttons[i].innerHTML;
            });
        }

        clear.addEventListener("click", function () {
            display.value = "";
        });

        deleteButton.addEventListener("click", function () {
            display.value = display.value.slice(0, -1);

        });

        equal.addEventListener("click", function () {
            let answer = eval(display.value);

            let item = document.createElement("li");

            item.className = "list-group-item";
            item.innerHTML = display.value + " = " + answer;
            history.appendChild(item);
            history.scrollTop = history.scrollHeight;
            display.value = answer;
        });

        clearHistory.addEventListener("click", function(){
            history.innerHTML = "";
        });
    </script>
</body>
</html>
