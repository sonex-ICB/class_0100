<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="content mx-2 d-flex gap-5"></div>
</body>
</html>
<script>
    const tent = [
    {
        name: "john",
        button: "Read"
    },
    {
        name: "john",
        button: "Unread"
    },
    {
        name: "john",
        button: "Unread"
    },
    {
        name: "john",
        button: "Unread"
    }
]
text = ""
tent.forEach (r => {
    main = r.button =="Unread" ? "danger": "success"
    text += `<div class="access access-${main}">
            <b> ${r.name} </b>
            <br>
            <button class="btn btn-${main}">${r.button}</button>
        </div>`
})
document.querySelector('.content').innerHTML = text





</script>
